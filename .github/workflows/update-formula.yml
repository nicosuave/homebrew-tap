name: Update formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          FORMULA: ${{ github.event.client_payload.formula }}
          VERSION: ${{ github.event.client_payload.version }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          set -euo pipefail

          # Strip v prefix if present
          VERSION="${VERSION#v}"

          echo "Updating ${FORMULA} to ${VERSION}"

          # Download SHA256 files
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          MACOS_ARM64_SHA=$(curl -fsSL "${BASE_URL}/${FORMULA}-${VERSION}-macos-arm64.tar.gz.sha256" | awk '{print $1}')
          MACOS_X86_SHA=$(curl -fsSL "${BASE_URL}/${FORMULA}-${VERSION}-macos-x86_64.tar.gz.sha256" | awk '{print $1}')
          LINUX_ARM64_SHA=$(curl -fsSL "${BASE_URL}/${FORMULA}-${VERSION}-linux-arm64.tar.gz.sha256" | awk '{print $1}')
          LINUX_X86_SHA=$(curl -fsSL "${BASE_URL}/${FORMULA}-${VERSION}-linux-x86_64.tar.gz.sha256" | awk '{print $1}')

          for sha in "${MACOS_ARM64_SHA}" "${MACOS_X86_SHA}" "${LINUX_ARM64_SHA}" "${LINUX_X86_SHA}"; do
            [[ "${sha}" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid SHA256: ${sha}" >&2; exit 1; }
          done

          MACOS_APP_SHA=""
          if [[ "${FORMULA}" == "comradex" ]]; then
            MACOS_APP_SHA=$(curl -fsSL "${BASE_URL}/comradex-menu-${VERSION}-macos-universal.zip.sha256" | awk '{print $1}')
            [[ "${MACOS_APP_SHA}" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid app SHA256: ${MACOS_APP_SHA}" >&2; exit 1; }
          fi

          echo "SHA256 sums:"
          echo "  macos-arm64: ${MACOS_ARM64_SHA}"
          echo "  macos-x86_64: ${MACOS_X86_SHA}"
          echo "  linux-arm64: ${LINUX_ARM64_SHA}"
          echo "  linux-x86_64: ${LINUX_X86_SHA}"
          if [[ -n "${MACOS_APP_SHA}" ]]; then
            echo "  macos-app: ${MACOS_APP_SHA}"
          fi

          # Update formula file
          FORMULA_FILE="Formula/${FORMULA}.rb"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "${FORMULA_FILE}"

          # Update SHA256 sums (in order they appear in file)
          # macos-arm64 is first, then macos-x86_64, then linux-arm64, then linux-x86_64
          awk -v ma="${MACOS_ARM64_SHA}" -v mx="${MACOS_X86_SHA}" -v la="${LINUX_ARM64_SHA}" -v lx="${LINUX_X86_SHA}" \
              -v repo="${REPO}" -v formula="${FORMULA}" -v version="${VERSION}" '
            BEGIN { macos_count=0; linux_count=0; base="https://github.com/" repo "/releases/download/v" version "/" formula "-" version }
            /on_macos do/,/end/ {
              if (/url/) {
                macos_count++
                platform = macos_count == 1 ? "macos-arm64" : "macos-x86_64"
                sub(/url ".*"/, "url \"" base "-" platform ".tar.gz\"")
              }
              if (/sha256/) {
                if (macos_count == 1) { sub(/sha256 ".*"/, "sha256 \"" ma "\"") }
                if (macos_count == 2) { sub(/sha256 ".*"/, "sha256 \"" mx "\"") }
              }
            }
            /on_linux do/,/end/ {
              if (/url/) {
                linux_count++
                platform = linux_count == 1 ? "linux-arm64" : "linux-x86_64"
                sub(/url ".*"/, "url \"" base "-" platform ".tar.gz\"")
              }
              if (/sha256/) {
                if (linux_count == 1) { sub(/sha256 ".*"/, "sha256 \"" la "\"") }
                if (linux_count == 2) { sub(/sha256 ".*"/, "sha256 \"" lx "\"") }
              }
            }
            { print }
          ' "${FORMULA_FILE}" > "${FORMULA_FILE}.tmp" && mv "${FORMULA_FILE}.tmp" "${FORMULA_FILE}"

          cat "${FORMULA_FILE}"

          if [[ "${FORMULA}" == "comradex" ]]; then
            # Keep the GUI app separate so the CLI formula and app cask can coexist.
            mkdir -p Casks
            cat > Casks/comradex-menu.rb <<CASK
          cask "comradex-menu" do
            version "${VERSION}"
            sha256 "${MACOS_APP_SHA}"

            url "${BASE_URL}/comradex-menu-${VERSION}-macos-universal.zip"
            name "Comradex Menu"
            desc "Menu bar companion for the Comradex account router"
            homepage "https://github.com/${REPO}"

            depends_on macos: ">= :sonoma"

            app "ComradexMenu.app"

            caveats <<~EOS
              Comradex Menu connects to the daemon installed by the Comradex formula:
                brew install nicosuave/tap/comradex
            EOS
          end
          CASK

            cat Casks/comradex-menu.rb
          fi

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || (git commit -m "Update ${{ github.event.client_payload.formula }} to ${{ github.event.client_payload.version }}" && git push)
